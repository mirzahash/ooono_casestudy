version: 2
sources:
  - name: ooono_raw
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    description: "Reports stored once; users are the latest full capture."
    tables:
      - name: drives
        identifier: DRIVE_REPORTS
      - name: warnings
        identifier: WARNING_REPORTS
      - name: users
        identifier: USER_PROFILES
      - name: ingestion_runs
        identifier: INGESTION_RUNS
