name: ooono_release_health
version: '1.0.0'
config-version: 2

profile: ooono_release_health

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]

clean-targets: [target, dbt_packages]

vars:
  validate_baseline: false

models:
  ooono_release_health:
    +persist_docs: {relation: true, columns: true}

    staging:
      +schema: STAGING
      +materialized: view

    intermediate:
      +schema: STAGING
      +materialized: table

    marts:
      +schema: ANALYTICS
      +materialized: table
      +grants:
        select: ['STEEP_READONLY']